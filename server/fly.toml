# Example Fly.io config. Set your own app name and region, then:
#   fly volumes create commonplace_data --size 1
#   fly secrets set COMMONPLACE_OWNER_TOKEN=$(python -c "import secrets; print('cp_' + secrets.token_urlsafe(24))")
#   fly deploy
app = "commonplace-CHANGE-ME"
primary_region = "fra"

[build]

[env]
  COMMONPLACE_DB = "/data/commonplace.db"
  COMMONPLACE_OWNER_NAME = "owner"

[mounts]
  source = "commonplace_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50

[[http_service.checks]]
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
